<title>Track Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Handjet:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   TRACK RUNNER — personal learning planner
   Design tokens. Light is the base; dark redefines tokens only.
   ============================================================ */
:root{
  color-scheme: light dark;

  /* ground + surfaces — warm paper with a clay hue bias */
  --paper:      #F3EFE6;
  --paper-2:    #EBE5D8;
  --surface:    #FDFAF4;
  --surface-2:  #F0EADC;
  --sunk:       #E4DDCC;

  /* ink */
  --ink:        #211E1A;
  --ink-2:      #6B6355;
  --ink-3:      #978E7D;

  /* structure */
  --line:       #211E1A;
  --line-2:     rgba(33,30,26,.18);
  --line-3:     rgba(33,30,26,.09);
  --shadow-c:   #211E1A;
  --shadow-a:   .9;

  /* accent — Claude clay */
  --clay:       #D97757;
  --clay-ink:   #A0451D;
  --clay-soft:  #F6DED1;

  /* semantic — separate from accent */
  --moss:       #4A7A52;
  --moss-soft:  #DCE8D9;
  --slate:      #41558C;
  --slate-soft: #DBE1F1;
  --amber:      #9A6E16;
  --amber-soft: #F3E5C2;
  --rust:       #9E3B2E;

  /* metrics */
  --rail: 264px;
  --pad: clamp(14px, 2.4vw, 28px);
  --r: 0px;
  --sh: 3px 3px 0 var(--shadow-c);
  --sh-lg: 5px 5px 0 var(--shadow-c);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --paper:      #14120F;
  --paper-2:    #1A1713;
  --surface:    #201C17;
  --surface-2:  #2A251E;
  --sunk:       #17140F;
  --ink:        #F2ECE0;
  --ink-2:      #A79D8C;
  --ink-3:      #7A7263;
  --line:       #4E4638;
  --line-2:     rgba(242,236,224,.16);
  --line-3:     rgba(242,236,224,.08);
  --shadow-c:   #000000;
  --clay:       #E08A6B;
  --clay-ink:   #EFA98D;
  --clay-soft:  #40261C;
  --moss:       #7FAF7F;
  --moss-soft:  #21301F;
  --slate:      #93A6DE;
  --slate-soft: #1E2436;
  --amber:      #D9AE55;
  --amber-soft: #332714;
  --rust:       #E0705C;
  }
}
:root[data-theme="dark"]{
  --paper:      #14120F;
  --paper-2:    #1A1713;
  --surface:    #201C17;
  --surface-2:  #2A251E;
  --sunk:       #17140F;
  --ink:        #F2ECE0;
  --ink-2:      #A79D8C;
  --ink-3:      #7A7263;
  --line:       #4E4638;
  --line-2:     rgba(242,236,224,.16);
  --line-3:     rgba(242,236,224,.08);
  --shadow-c:   #000000;
  --clay:       #E08A6B;
  --clay-ink:   #EFA98D;
  --clay-soft:  #40261C;
  --moss:       #7FAF7F;
  --moss-soft:  #21301F;
  --slate:      #93A6DE;
  --slate-soft: #1E2436;
  --amber:      #D9AE55;
  --amber-soft: #332714;
  --rust:       #E0705C;
}

/* ---------- base ---------- */
*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: color-mix(in srgb, var(--clay) 26%, transparent);
}
h1,h2,h3,h4{
  font-family: "Alegreya", ui-serif, Georgia, "Times New Roman", serif;
  font-weight: 700;
  line-height: 1.12;
  text-wrap: balance;
  margin: 0;
  letter-spacing: -.012em;
}
p{ margin:0; }
a{ color: var(--clay-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover{ color: var(--ink); }
button, input, select, textarea{ font: inherit; color: inherit; }
:where(button,[href],input,select,textarea,summary,[tabindex]):focus-visible{
  outline: 2px solid var(--clay);
  outline-offset: 2px;
}
::selection{ background: var(--clay); color: #fff; }
[hidden]{ display: none !important; }

/* ---------- pixel primitives ---------- */
.mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.px{
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .05em;
  font-size: 12px;
  line-height: 1;
}
.dither{
  background-image: radial-gradient(var(--line-2) 1px, transparent 1px);
  background-size: 4px 4px;
}
.px.faint{ color: var(--ink-2); }
.px.muted{ color: var(--ink-2); }
.scan{
  background-image: repeating-linear-gradient(0deg, var(--line-3) 0 1px, transparent 1px 3px);
}

/* card: hard pixel frame */
.card{
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
}
.card--flat{ box-shadow: none; }
.card--sunk{ background: var(--surface-2); box-shadow: none; }

/* buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace;
  font-weight: 500; text-transform: uppercase; letter-spacing:.04em; font-size: 13px; line-height:1;
  padding: 8px 12px 7px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh);
  cursor: pointer;
  transition: transform .08s steps(2,end), box-shadow .08s steps(2,end), background-color .12s linear, color .12s linear;
  white-space: nowrap;
}
.btn:hover{ background: var(--surface-2); }
.btn:active{ transform: translate(3px,3px); box-shadow: 0 0 0 var(--shadow-c); }
.btn--primary{ background: var(--clay); color:#1a0f09; border-color: var(--line); }
.btn--primary:hover{ background: color-mix(in srgb, var(--clay) 84%, var(--ink)); color:#1a0f09; }
.btn--ghost{ background: transparent; box-shadow:none; border-color: var(--line-2); }
.btn--ghost:hover{ background: var(--surface-2); border-color: var(--line); }
.btn--ghost:active{ transform:none; }
.btn--sm{ padding: 6px 9px 5px; font-size: 12px; }
.btn--danger:hover{ background: var(--rust); color: #fff; border-color: var(--rust); }
.btn[disabled]{ opacity:.42; cursor: not-allowed; box-shadow:none; }
.iconbtn{
  display:inline-grid; place-items:center;
  width:32px; height:32px; padding:0;
  background: transparent; color: var(--ink-2);
  border: 2px solid transparent; border-radius: var(--r);
  cursor:pointer;
  transition: color .12s linear, background-color .12s linear, border-color .12s linear;
}
.iconbtn:hover{ color: var(--ink); background: var(--surface-2); border-color: var(--line-2); }
.iconbtn svg{ width:16px; height:16px; }

/* chips + badges */
.chip{
  display:inline-flex; align-items:center; gap:5px;
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:11.5px; line-height:1;
  text-transform: uppercase; letter-spacing:.04em;
  padding: 5px 7px 4px;
  border: 1.5px solid var(--line-2);
  border-radius: var(--r);
  color: var(--ink-2);
  background: var(--surface-2);
  white-space: nowrap;
}
.chip--done{ color: var(--moss); background: var(--moss-soft); border-color: color-mix(in srgb, var(--moss) 45%, transparent); }
.chip--doing{ color: var(--slate); background: var(--slate-soft); border-color: color-mix(in srgb, var(--slate) 45%, transparent); }
.chip--todo{ color: var(--ink-2); }
.chip--warn{ color: var(--amber); background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.chip--clay{ color: var(--clay-ink); background: var(--clay-soft); border-color: color-mix(in srgb, var(--clay) 50%, transparent); }

/* segmented pixel progress bar */
.bar{
  position: relative;
  height: 12px;
  border: 2px solid var(--line);
  background: var(--sunk);
  overflow: hidden;
}
.bar__fill{
  height:100%;
  background: var(--clay);
  background-image: repeating-linear-gradient(90deg, transparent 0 5px, color-mix(in srgb, var(--shadow-c) 26%, transparent) 5px 7px);
  transition: width .45s cubic-bezier(.2,.8,.2,1);
}
.bar--moss .bar__fill{ background-color: var(--moss); }
.bar--slate .bar__fill{ background-color: var(--slate); }
.bar--sm{ height: 8px; border-width: 1.5px; }
.bar--lg{ height: 20px; }

/* pixel checkbox */
.pcheck{
  appearance: none; -webkit-appearance:none;
  flex: 0 0 auto;
  width: 18px; height: 18px; margin: 0;
  border: 2px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  display: grid; place-items:center;
  transition: background-color .12s linear, border-color .12s linear;
}
.pcheck::after{
  content:"";
  width:10px; height:10px;
  background: transparent;
  clip-path: polygon(0 40%, 20% 40%, 20% 60%, 40% 60%, 40% 80%, 60% 80%, 60% 60%, 80% 60%, 80% 40%, 100% 40%, 100% 20%, 80% 20%, 80% 0, 60% 0, 60% 20%, 40% 20%, 40% 40%, 20% 40%, 20% 20%, 0 20%);
  transform: scale(.2);
  transition: transform .14s steps(3,end), background-color .1s linear;
}
.pcheck:checked{ background: var(--moss); border-color: var(--moss); }
.pcheck:checked::after{ background: var(--surface); transform: scale(1); }
.pcheck:hover{ border-color: var(--clay); }

/* inputs */
.field{
  width:100%;
  padding: 9px 10px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--line-2);
  border-radius: var(--r);
  font-size: 14px;
  transition: border-color .12s linear, background-color .12s linear;
}
.field::placeholder{ color: var(--ink-3); }
.field:focus{ border-color: var(--clay); outline: none; }
.field:focus-visible{ outline: none; }
textarea.field{ resize: vertical; min-height: 76px; line-height:1.5; font-family: inherit; }
select.field{ background-color: var(--surface); color: var(--ink); }
.lab{
  display:block; margin-bottom: 5px;
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:12px;
  text-transform: uppercase; letter-spacing:.05em; color: var(--ink-2);
}
.formgrid{ display:grid; gap: 13px; }
.formrow{ display:grid; grid-template-columns: 1fr 1fr; gap: 13px; }
@media (max-width: 560px){ .formrow{ grid-template-columns: 1fr; } }

/* ============================================================
   Shell
   ============================================================ */
.shell{ min-height: 100dvh; display:flex; flex-direction: column; }

.topbar{
  position: sticky; top: 0; z-index: 40;
  display:flex; align-items:center; gap: 12px;
  padding: 10px var(--pad);
  padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--line);
}
.brand{ display:flex; align-items:center; gap: 10px; min-width:0; }
.brand__mark{
  width: 30px; height: 30px; flex:0 0 auto;
  border: 2px solid var(--line);
  background: var(--clay);
  display:grid; place-items:center;
  box-shadow: var(--sh);
}
.brand__mark svg{ width: 18px; height: 18px; }
.brand__txt{ min-width:0; }
.brand__name{
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:700; font-size: 16px; letter-spacing:.02em;
  text-transform: uppercase; line-height:1.05;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand__sub{ font-size: 11px; color: var(--ink-3); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar__spacer{ flex:1 1 auto; }
.topbar__tools{ display:flex; align-items:center; gap: 6px; }

.savechip{
  display:inline-flex; align-items:center; gap:6px;
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  padding: 6px 8px 5px;
  border: 1.5px solid var(--line-2);
  color: var(--ink-2);
  background: var(--surface);
  white-space: nowrap;
}
.savechip__dot{ width:7px; height:7px; background: var(--ink-3); flex:0 0 auto; }
.savechip[data-state="saving"] .savechip__dot{ background: var(--amber); animation: blink 1s steps(2,end) infinite; }
.savechip[data-state="saved"] .savechip__dot{ background: var(--moss); }
.savechip[data-state="local"] .savechip__dot{ background: var(--slate); }
.savechip[data-state="error"] .savechip__dot{ background: var(--rust); }
@keyframes blink{ 50%{ opacity:.25 } }

.body{ display:flex; align-items: flex-start; flex: 1 1 auto; min-height:0; }

/* ---------- rail ---------- */
.rail{
  width: var(--rail); flex: 0 0 var(--rail);
  align-self: stretch;
  border-right: 2px solid var(--line);
  padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
  display:flex; flex-direction: column; gap: 18px;
  position: sticky; top: var(--topbar-h, 54px);
  max-height: calc(100dvh - var(--topbar-h, 54px));
  overflow-y: auto;
  background: var(--paper-2);
  z-index: 30;
}
.rail__group{ display:flex; flex-direction:column; gap: 7px; }
.rail__title{
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:12px; text-transform:uppercase;
  letter-spacing:.06em; color: var(--ink-3); padding: 0 2px 2px;
  display:flex; align-items:center; justify-content:space-between; gap:6px;
}
.navbtn{
  display:flex; align-items:center; gap: 9px;
  width:100%; text-align:left;
  padding: 8px 9px;
  background: transparent;
  border: 2px solid transparent;
  border-radius: var(--r);
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13.5px; font-weight: 500;
  transition: background-color .12s linear, color .12s linear, border-color .12s linear;
}
.navbtn svg{ width:15px; height:15px; flex:0 0 auto; opacity:.8; }
.navbtn:hover{ background: var(--surface-2); color: var(--ink); }
.navbtn[aria-current="page"]{
  background: var(--surface); color: var(--ink); font-weight: 600;
  border-color: var(--line); box-shadow: 2px 2px 0 var(--shadow-c);
}
.navbtn[aria-current="page"] svg{ opacity:1; color: var(--clay-ink); }
.navbtn__count{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.trackbtn{
  display:block; width:100%; text-align:left;
  padding: 9px 10px;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line-2); border-radius: var(--r);
  cursor:pointer;
  transition: border-color .12s linear, box-shadow .08s steps(2,end), transform .08s steps(2,end);
}
.trackbtn:hover{ border-color: var(--line); }
.trackbtn[aria-current="true"]{ border-color: var(--line); box-shadow: 3px 3px 0 var(--shadow-c); }
.trackbtn__name{ font-size:13px; font-weight:600; line-height:1.25; margin-bottom:6px; }
.trackbtn__meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; }

.railstat{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.railstat__cell{ border:2px solid var(--line-2); padding: 8px 9px; background: var(--surface); }
.railstat__k{ font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); }
.railstat__v{ font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600; font-variant-numeric: tabular-nums; line-height:1.2; margin-top:2px; }

/* ---------- main ---------- */
.main{
  flex: 1 1 auto; min-width: 0;
  padding: var(--pad);
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap: 20px;
}
.wrap{ width:100%; max-width: 1080px; }
.view{ display:flex; flex-direction:column; gap: 20px; }
.view.is-new{ animation: fadein .22s ease-out; }
@keyframes fadein{ from{ opacity:0; transform: translateY(4px) } }

.viewhead{ display:flex; align-items: flex-end; justify-content:space-between; gap: 14px; flex-wrap: wrap; }
.viewhead h1{ font-size: clamp(24px, 3.4vw, 34px); }
.viewhead__sub{ color: var(--ink-2); font-size: 13.5px; max-width: 62ch; margin-top: 6px; }

.sechead{ display:flex; align-items:center; gap:10px; margin-bottom: 2px; }
.sechead h2{ font-size: 17px; }
.sechead__rule{ flex:1 1 auto; height:0; border-top: 2px dotted var(--line-2); }

/* mobile: rail becomes a scroll strip */
@media (max-width: 900px){
  .body{ flex-direction: column; align-items: stretch; }
  .rail{
    width:100%; flex: 0 0 auto; max-height:none;
    position: sticky; top: var(--topbar-h, 54px); z-index: 30;
    border-right: none; border-bottom: 2px solid var(--line);
    flex-direction: row; overflow-x: auto; overflow-y: hidden;
    overscroll-behavior-x: contain;
    gap: 12px; padding: 9px var(--pad); align-items: center;
    scrollbar-width: thin;
    background: var(--paper-2);
  }
  .main{ scroll-padding-top: 0; }
  .rail__group{ flex-direction: row; align-items:center; gap: 6px; flex: 0 0 auto; }
  .rail__title{ display:none; }
  .navbtn{ width:auto; padding: 7px 10px; }
  .navbtn__count{ margin-left: 4px; }
  .rail__group--tracks{ order: -1; }
  .trackbtn{ width: auto; min-width: 132px; max-width: 190px; padding: 7px 9px; }
  .trackbtn__name{ margin-bottom: 4px; font-size: 12.5px; }
  .railstat{ display:none; }
  .rail__group--stats{ display:none; }
}
</style>
<style>
/* ============================================================
   Overview
   ============================================================ */
.hero{
  display:grid;
  grid-template-columns: minmax(0,1.35fr) minmax(0,1fr);
  gap: 0;
  border: 2px solid var(--line);
  box-shadow: var(--sh-lg);
  background: var(--surface);
  overflow: hidden;
}
@media (max-width: 780px){ .hero{ grid-template-columns: 1fr; } }
.hero__left{ padding: clamp(16px,2.6vw,26px); display:flex; flex-direction:column; gap: 16px; min-width:0; }
.hero__right{
  padding: clamp(16px,2.6vw,26px);
  border-left: 2px solid var(--line);
  background: var(--paper-2);
  background-image: radial-gradient(var(--line-3) 1px, transparent 1px);
  background-size: 4px 4px;
  display:flex; flex-direction:column; gap: 16px; min-width:0;
}
@media (max-width: 780px){ .hero__right{ border-left:none; border-top: 2px solid var(--line); } }
.hero__eyebrow{ display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
.hero__title{ font-size: clamp(26px, 4.2vw, 40px); }
.hero__note{ color: var(--ink-2); font-size: 14px; max-width: 52ch; }

.levelbox{ display:flex; align-items:stretch; gap: 14px; }
.levelbox__tile{
  flex: 0 0 auto; width: 78px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 2px;
  padding: 9px 4px 11px;
  border: 2px solid var(--line);
  background: var(--clay);
  color: #1a0f09;
  box-shadow: var(--sh);
}
.levelbox__lab{
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace;
  font-weight:600; font-size: 12px; letter-spacing:.14em; text-transform: uppercase; line-height:1;
}
.levelbox__num{
  font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace;
  font-weight: 700; font-size: 46px; line-height:.84; letter-spacing:-.02em;
}
.levelbox__meta{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:8px; }
.levelbox__row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.levelbox__row .px{ color: var(--ink-2); }

.statgrid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
.stat{
  border: 2px solid var(--line);
  background: var(--surface);
  padding: 11px 12px;
  display:flex; flex-direction:column; gap: 4px;
  min-width: 0;
}
.stat__k{ font-family:"Handjet","IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); }
.stat__v{ font-family:"IBM Plex Mono",monospace; font-size: 22px; font-weight:600; line-height:1.1; font-variant-numeric: tabular-nums; }
.stat__v small{ font-size: 12px; color: var(--ink-3); font-weight:500; }
.stat__hint{ font-size: 11.5px; color: var(--ink-3); }

/* step ladder */
.ladder{ display:flex; flex-direction:column; gap: 10px; }
.step{
  display:grid; grid-template-columns: 46px minmax(0,1fr) auto;
  align-items:center; gap: 13px;
  padding: 12px 14px;
  border: 2px solid var(--line-2);
  background: var(--surface);
  text-align:left; width:100%; cursor:pointer;
  transition: border-color .12s linear, transform .08s steps(2,end), box-shadow .08s steps(2,end);
}
.step:hover{ border-color: var(--line); box-shadow: 3px 3px 0 var(--shadow-c); transform: translate(-1px,-1px); }
.step__n{

}

}

}
.pxrange::-webkit-slider-thumb{

}

}

/* toast */
.toasts{
  position: fixed; z-index: 90;
  left: 50%; transform: translateX(-50%);
  bottom: max(16px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap: 8px; align-items:center;
  pointer-events:none; width: min(440px, calc(100vw - 24px));
}
.toast{
  display:flex; align-items:center; gap: 9px;
  padding: 9px 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  box-shadow: var(--sh);
  font-size: 13px;
  animation: toastin .2s cubic-bezier(.2,.8,.2,1);
  pointer-events: auto;
  max-width: 100%;
}

/* XP burst on completion */
.xpfloat{

}

  100%{ opacity:0; transform: translateY(-38px) scale(1) }
}

@media (prefers-reduced-motion: reduce){

}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

let _uid = 0;
const uid = (p) => (p || "x") + "-" + Date.now().toString(36) + "-" + (_uid++).toString(36);

const esc = (s) =>
  String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/* minimal inline markup: `code` and **bold** */
function fmt(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code translate="no">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

const todayISO = () => {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
};

const LOCALE = "uk-UA";
const dfShort = new Intl.DateTimeFormat(LOCALE, { day: "2-digit", month: "2-digit" });
const dfLong = new Intl.DateTimeFormat(LOCALE, { day: "numeric", month: "long", year: "numeric" });
const nf = new Intl.NumberFormat(LOCALE);

const pluralRules = new Intl.PluralRules(LOCALE);
/* 1 задача · 2 задачі · 5 задач */
function nplural(n, one, few, many) {
  const k = pluralRules.select(n);
  return nf.format(n) + " " + (k === "one" ? one : k === "few" ? few : many);
}

function parseISO(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d) ? null : d;
}
const fmtShort = (iso) => { const d = parseISO(iso); return d ? dfShort.format(d) : ""; };
const fmtLong = (iso) => { const d = parseISO(iso); return d ? dfLong.format(d) : ""; };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

function safeUrl(u) {
  const s = String(u || "").trim();
  if (!s) return "";
  if (/^https?:\/\//i.test(s)) return s;
  if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s)) return "https://" + s;
  return "";
}
function hostOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; }
}
const pct = (done, total) => (total > 0 ? Math.round((done / total) * 100) : 0);

/* ============================================================
   Track normalization — seed → runtime shape with stable ids
   ============================================================ */
function normalizeTrack(seed, tid) {
  const id = tid || "trk-ai";
  const steps = (seed.steps || []).map((st, si) => ({
    id: id + ".s" + si,
    tag: st.tag || "Step " + (si + 1),
    title: st.title || "",
    sub: st.sub || "",
    hours: st.hours || 0,
    artifact: st.artifact || "",
    phases: (st.phases || []).map((ph, pi) => ({
      id: id + ".s" + si + ".p" + pi,
      title: ph.title || "",
      goal: ph.goal || "",
      note: ph.note || "",
      hours: ph.hours || 0,
      kind: ph.kind || "phase",
      checkpoint: ph.checkpoint || "",
      materials: (ph.materials || []).map((m, mi) => ({
        id: id + ".s" + si + ".p" + pi + ".m" + mi,
        t: m.t || "", u: m.u || "", n: m.n || "", g: m.g || ""
      })),
      sections: (ph.sections || []).map((sec, ci) => ({
        id: id + ".s" + si + ".p" + pi + ".c" + ci,
        title: sec.title || "",
        hours: sec.hours || 0,
        note: sec.note || "",
        checkpoint: sec.checkpoint || "",
        tasks: (sec.tasks || []).map((t, ti) => {
          const text = Array.isArray(t) ? t[0] : t;
          const at = Array.isArray(t) ? t[1] : null;
          return {
            id: id + ".s" + si + ".p" + pi + ".c" + ci + ".t" + ti,
            text: text, done: !!at, doneAt: at || null, note: ""
          };
        })
      }))
    }))
  }));

  return {
    id: id,
    title: seed.title, subtitle: seed.subtitle || "", start: seed.start || todayISO(),
    hours: seed.hours || 0, budget: seed.budget || "", role: seed.role || "", note: seed.note || "",
    steps: steps,
    principles: (seed.principles || []).map((p) => ({ t: p[0], b: p[1] })),
    exams: seed.exams || [], examsNote: seed.examsNote || "", examsSkip: seed.examsSkip || ""
  };
}

function blankTrack(title) {
  return {

    hours: 0, budget: "", role: "", note: "",
    steps: [{ id: uid("s"), tag: "Step 1", title: "Початок", sub: "", hours: 0, artifact: "", phases: [] }],
    principles: [], exams: [], examsNote: "", examsSkip: ""
  };
}

/* migrate anything loaded from disk into the current shape */
function migrate(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.tracks) || !raw.tracks.length) return null;
  raw.v = 1;
  raw.courses = Array.isArray(raw.courses) ? raw.courses : [];
  raw.resources = Array.isArray(raw.resources) ? raw.resources : [];
  raw.log = Array.isArray(raw.log) ? raw.log : [];
  raw.tracks.forEach((t) => {
    t.steps = Array.isArray(t.steps) ? t.steps : [];
    t.principles = Array.isArray(t.principles) ? t.principles : [];
    t.exams = Array.isArray(t.exams) ? t.exams : [];
    t.steps.forEach((s) => {
      s.phases = Array.isArray(s.phases) ? s.phases : [];
      s.phases.forEach((p) => {
        p.materials = Array.isArray(p.materials) ? p.materials : [];
        p.sections = Array.isArray(p.sections) ? p.sections : [];
        p.sections.forEach((c) => { c.tasks = Array.isArray(c.tasks) ? c.tasks : []; });
      });
    });
  });
  if (!raw.tracks.some((t) => t.id === raw.activeTrack)) raw.activeTrack = raw.tracks[0].id;
  return raw;
}

/* ============================================================
   Persistence — artifact file publish, mirrored to localStorage
   ============================================================ */
const store = {
  api: null,
  mode: "local",      // "cloud" | "local"
  timer: null,
  pending: false,
  inflight: false,

  async init() {
    try {
      this.api = (window.claude && typeof window.claude.use === "function")
        ? await window.claude.use("artifact")
        : null;
    } catch { this.api = null; }
    this.mode = this.api ? "cloud" : "local";
  },

  readLocal() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? migrate(JSON.parse(raw)) : null;
    } catch { return null; }
  },

  writeLocal(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; }
    catch { return false; }
  },

  async readRemote() {
    try {
      const res = await fetch(DATA_PATH + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return null;
      return migrate(await res.json());
    } catch { return null; }
  },

  queue() {
    state.updatedAt = new Date().toISOString();
    this.writeLocal(state);
    this.pending = true;
    setSaveChip("saving", "Збереження…");
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1400);
  },

  async flush() {
    if (!this.pending || this.inflight) return;
    if (this.mode !== "cloud" || !this.api) {
      this.pending = false;
      setSaveChip("local", "На цьому пристрої");
      return;
    }
    this.inflight = true;
    this.pending = false;
    try {
      const files = {};
      files[DATA_PATH] = { content: JSON.stringify(state), contentType: "application/json" };
      await this.api.publish(files);
      setSaveChip("saved", "Збережено");
    } catch (err) {
      const code = (err && err.code) || "upstream_error";
      if (code === "conflict") {
        setSaveChip("error", "Змінено деінде");
        toast("Дані змінилися в іншій вкладці. Оновіть сторінку, щоб підтягнути їх.", "bad");
      } else if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
                 code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
        this.mode = "local";
        setSaveChip("local", "На цьому пристрої");
      } else if (code === "rate_limited") {
        this.pending = true;
        setSaveChip("saving", "Збереження…");
        setTimeout(() => { this.inflight = false; this.flush(); }, 6000);
        return;
      } else {
        setSaveChip("error", "Не збережено");
        toast("Не вдалося зберегти на сервері — дані лишились у цьому браузері.", "bad");
      }
    } finally {
      this.inflight = false;
      if (this.pending) setTimeout(() => this.flush(), 800);
    }
  }
};

/* commit: mutate state, re-render, schedule a save */
function commit(fn, opts) {
  if (typeof fn === "function") fn();
  store.queue();
  if (!opts || opts.render !== false) render();
}

function setSaveChip(stateName, text) {
  const chip = $("#saveChip");
  if (!chip) return;
  chip.dataset.state = stateName;

/* ============================================================
   Toast
   ============================================================ */
function toast(msg, kind) {
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "bad" ? " toast--bad" : kind === "good" ? " toast--good" : "");
  el.innerHTML = '<span class="toast__ico">' + ico(kind === "bad" ? "warn" : "check") + "</span><span>" + esc(msg) + "</span>";
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .25s linear";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 280);
  }, kind === "bad" ? 5200 : 2600);
}

function xpBurst(anchor, text) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = anchor.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "xpfloat";
  el.textContent = text;
  el.style.left = Math.round(r.right + 6) + "px";
  el.style.top = Math.round(r.top - 2) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

/* ============================================================
   Derived stats
   ============================================================ */
const activeTrack = () => state.tracks.find((t) => t.id === state.activeTrack) || state.tracks[0];

function eachTask(track, fn) {
  (track.steps || []).forEach((s) =>
    (s.phases || []).forEach((p) =>
      (p.sections || []).forEach((c) =>
        (c.tasks || []).forEach((t) => fn(t, c, p, s)))));
}

function countTasks(node) {
  let done = 0, total = 0;
  const walkSection = (c) => (c.tasks || []).forEach((t) => { total++; if (t.done) done++; });
  const walkPhase = (p) => (p.sections || []).forEach(walkSection);
  const walkStep = (s) => (s.phases || []).forEach(walkPhase);
  if (node.steps) node.steps.forEach(walkStep);
  else if (node.phases) walkStep(node);
  else if (node.sections) walkPhase(node);
  else walkSection(node);
  return { done: done, total: total, pct: pct(done, total) };
}

/* hours credited proportionally to task completion inside each phase */
function hoursDone(track) {
  let h = 0;
  (track.steps || []).forEach((s) =>
    (s.phases || []).forEach((p) => {
      const c = countTasks(p);
      if (p.hours && c.total) h += (p.hours * c.done) / c.total;
    }));
  return Math.round(h);
}

function levelFor(doneCount) {
  const lvl = Math.floor(doneCount / 12) + 1;
  const into = doneCount % 12;
  return { level: lvl, into: into, need: 12, pct: Math.round((into / 12) * 100) };
}

/* the phase that is currently in play: first one not finished */
function currentPhase(track) {
  for (const s of track.steps || []) {
    for (const p of s.phases || []) {
      const c = countTasks(p);
      if (c.total && c.done < c.total) return { step: s, phase: p, count: c };
    }
  }
  return null;
}

function nextTasks(track, n) {
  const out = [];
  for (const s of track.steps || []) {
    for (const p of s.phases || []) {
      for (const c of p.sections || []) {
        for (const t of c.tasks || []) {
          if (!t.done) {
            out.push({ task: t, section: c, phase: p, step: s });
            if (out.length >= n) return out;
          }
        }
      }
    }
  }
  return out;
}

function recentDone(track, n) {
  const out = [];
  eachTask(track, (t, c, p) => { if (t.done && t.doneAt) out.push({ task: t, section: c, phase: p }); });
  out.sort((a, b) => (a.task.doneAt < b.task.doneAt ? 1 : a.task.doneAt > b.task.doneAt ? -1 : 0));
  return out.slice(0, n);
}

function activeDays(track) {
  const days = new Set();
  eachTask(track, (t) => { if (t.doneAt) days.add(t.doneAt); });
  return days;
}

    : "";

  return '<div class="view">' +
    '<div class="viewhead"><div><h1>План</h1>' +
      '<p class="viewhead__sub">' + esc(tr.subtitle || "Кроки, фази і задачі треку.") + "</p></div>" +
      '<button class="btn" type="button" data-act="add-step">' + ico("plus") + "Новий step</button></div>" +
    toolbar + nothing +
    ((tr.steps || []).length
      ? body
      : '<div class="empty">' + ico("flag", "empty__ico") +
        "<span>Трек порожній. Почни з step — великого етапу, що закінчується робочим артефактом.</span>" +
        '<button class="btn btn--sm btn--primary" type="button" data-act="add-step">' + ico("plus") + "Створити перший step</button></div>") +

  function seg(v, label) {
    return '<button type="button" data-act="filter" data-id="' + v + '" aria-pressed="' + (ui.planFilter === v) + '">' + esc(label) + "</button>";
  }

  function renderPhase(p, s) {
    const c = countTasks(p);
    const tasksHtml = (p.sections || []).map((sec) => renderSection(sec, p)).join("");
    const hasVisible = /class="task /.test(tasksHtml);
    if (filtering && !hasVisible) return "";
    if (!filtering || hasVisible) shown += hasVisible ? 1 : 0;

    const open = filtering ? true : !!ui.open[p.id];
    const mats = renderMaterials(p);

    return '<article class="phase' + (p.kind === "project" ? " phase--project" : "") + '" id="' + esc(p.id) + '" data-open="' + open + '">' +
      '<div class="phase__head">' +
        '<button class="phase__toggle" type="button" data-act="toggle-phase" data-id="' + esc(p.id) + '" aria-expanded="' + open + '" aria-controls="body-' + esc(p.id) + '">' +
          '<span class="phase__caret">' + ico("chev") + "</span>" +
          '<span class="phase__title">' +
            '<span class="phase__name">' + (p.kind === "project" ? "🎯 " : "") + esc(p.title) + "</span>" +
            (p.goal ? '<span class="phase__goal">' + fmt(p.goal) + "</span>" : "") +
          "</span>" +
          '<span class="phase__right">' +
            (p.hours ? '<span class="chip">' + esc(hoursLabel(p.hours)) + "</span>" : "") +
            '<span class="phase__ratio" data-count="' + esc(p.id) + '">' + c.done + "/" + c.total + "</span>" +
            '<span class="phase__minibar" data-bar="' + esc(p.id) + '">' + bar(c.pct, "bar--sm") + "</span>" +
          "</span>" +
        "</button>" +
        '<span class="phase__acts">' +
          '<button class="iconbtn" type="button" data-act="edit-phase" data-id="' + esc(p.id) + '" aria-label="Змінити фазу ' + esc(p.title) + '">' + ico("pen") + "</button>" +
          '<button class="iconbtn" type="button" data-act="del-phase" data-id="' + esc(p.id) + '" aria-label="Видалити фазу ' + esc(p.title) + '">' + ico("trash") + "</button>" +
        "</span>" +
      "</div>" +
      (open
        ? '<div class="phase__inner" id="body-' + esc(p.id) + '">' + mats +
            (p.note ? '<p class="section__note" style="padding:8px 14px 0">' + fmt(p.note) + "</p>" : "") +
            tasksHtml +
            (p.checkpoint ? checkpointHtml("Контрольна точка фази", p.checkpoint) : "") +
            '<div class="addline"><button class="btn btn--sm btn--ghost" type="button" data-act="add-section" data-id="' + esc(p.id) + '">' +
              ico("plus") + "Новий блок</button>" +
              '<button class="btn btn--sm btn--ghost" type="button" data-act="add-material" data-id="' + esc(p.id) + '">' + ico("link") + "Матеріал</button>" +
            "</div>" +
          "</div>"
        : "") +
      "</article>";
  }

  function renderMaterials(p) {
    if (!(p.materials || []).length) return "";
    const groups = new Map();
    p.materials.forEach((m) => {
      const g = m.g || "";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(m);
    });
    let out = "";
    groups.forEach((items, g) => {
      out += '<div class="matlist">' +
        (g ? '<div class="px faint" style="margin-bottom:2px">' + esc(g) + "</div>" : "") +
        '<div class="matgrid">' +
        items.map((m) =>
          '<div class="matrow"><span class="matrow__ico">' + ico("link") + "</span>" +
            '<span class="matrow__body">' +
              (safeUrl(m.u)
                ? '<a href="' + esc(safeUrl(m.u)) + '" target="_blank" rel="noopener noreferrer">' + esc(m.t) + "</a>"
                : esc(m.t)) +
              (m.n ? '<span class="matrow__note"> — ' + esc(m.n) + "</span>" : "") +
            "</span>" +
            '<button class="iconbtn" type="button" data-act="del-material" data-id="' + esc(m.id) + '" aria-label="Прибрати матеріал" style="width:22px;height:22px">' + ico("trash") + "</button>" +
          "</div>").join("") + "</div></div>";
    });
    return out;
  }

  function renderSection(sec, p) {
    const visible = (sec.tasks || []).filter(taskMatches);
    if (filtering && !visible.length) return "";
    const c = countTasks(sec);
    return '<div class="section" id="' + esc(sec.id) + '">' +
      '<div class="section__head">' +
        '<span class="section__name">' + esc(sec.title) + "</span>" +
        (sec.hours ? '<span class="px faint">' + esc(hoursLabel(sec.hours)) + "</span>" : "") +
        '<span class="px faint" data-count="' + esc(sec.id) + '">' + c.done + "/" + c.total + "</span>" +
        '<span class="grow"></span>' +
        '<button class="iconbtn" type="button" data-act="add-task" data-id="' + esc(sec.id) + '" aria-label="Додати задачу в ' + esc(sec.title) + '" style="width:24px;height:24px">' + ico("plus") + "</button>" +
        '<button class="iconbtn" type="button" data-act="edit-section" data-id="' + esc(sec.id) + '" aria-label="Змінити блок" style="width:24px;height:24px">' + ico("pen") + "</button>" +
        '<button class="iconbtn" type="button" data-act="del-section" data-id="' + esc(sec.id) + '" aria-label="Видалити блок" style="width:24px;height:24px">' + ico("trash") + "</button>" +
      "</div>" +
      (sec.note ? '<p class="section__note">' + fmt(sec.note) + "</p>" : "") +
      '<div class="tasks">' + visible.map(renderTask).join("") + "</div>" +
      (sec.checkpoint ? checkpointHtml("Контрольна точка", sec.checkpoint) : "") +
      "</div>";
  }

  function renderTask(t) {
    return '<div class="task ' + (t.done ? "is-done" : "") + '">' +
      '<label class="task__lab">' +
        '<input class="pcheck" type="checkbox" data-act="toggle" data-id="' + esc(t.id) + '"' + (t.done ? " checked" : "") + ">" +
        '<span class="grow"><span class="task__txt">' + fmt(t.text) + "</span>" +
          (t.note ? '<span class="task__note">' + fmt(t.note) + "</span>" : "") +
        "</span>" +
      "</label>" +
      (t.doneAt ? '<span class="task__date">' + esc(fmtShort(t.doneAt)) + "</span>" : "") +
      '<span class="task__act">' +
        '<button class="iconbtn" type="button" data-act="edit-task" data-id="' + esc(t.id) + '" aria-label="Змінити задачу" style="width:24px;height:24px">' + ico("pen") + "</button>" +
        '<button class="iconbtn" type="button" data-act="del-task" data-id="' + esc(t.id) + '" aria-label="Видалити задачу" style="width:24px;height:24px">' + ico("trash") + "</button>" +
      "</span></div>";
  }

  function checkpointHtml(label, text) {
    return '<div class="checkpoint"><span class="checkpoint__ico">' + ico("target") + "</span>" +
      "<span><b>" + esc(label) + ".</b> " + fmt(text) + "</span></div>";
  }
}

function viewCourses() {
  const f = ui.courseFilter;
  const list = state.courses.filter((c) => f === "all" || c.status === f);
  const order = { active: 0, planned: 1, paused: 2, done: 3 };
  list.sort((a, b) => (order[a.status] - order[b.status]) || a.title.localeCompare(b.title, LOCALE));

  const counts = state.courses.reduce((acc, c) => { acc[c.status] = (acc[c.status] || 0) + 1; return acc; }, {});
  const totalH = state.courses.reduce((s, c) => s + (Number(c.hours) || 0), 0);
  const doneH = state.courses.reduce((s, c) => s + ((Number(c.hours) || 0) * (Number(c.progress) || 0)) / 100, 0);

          '<button class="iconbtn" type="button" data-act="del-course" data-id="' + esc(c.id) + '" aria-label="Видалити курс" style="width:26px;height:26px">' + ico("trash") + "</button>" +
        "</div></div>" +
      '<div class="row row--tight">' + chip(st.label, st.mod) +
        (c.hours ? chip(hoursLabel(c.hours)) : "") + (c.phase ? chip(c.phase) : "") + "</div>" +
      '<div class="col" style="gap:5px">' +
        '<div class="row" style="justify-content:space-between"><span class="px faint">Прогрес</span>' +
          '<span class="px" style="color:var(--clay-ink)">' + (c.progress || 0) + "%</span></div>" +
        bar(c.progress || 0, c.status === "done" ? "bar--moss" : "bar--slate", "bar--sm") +

          ' data-act="course-progress" data-id="' + esc(c.id) + '" aria-label="Прогрес курсу ' + esc(c.title) + '">' +
      "</div>" +
      (c.note ? '<div class="ccard__note">' + fmt(c.note) + "</div>" : "") +
      ((c.tags || []).length ? '<div class="ccard__tags">' + c.tags.map((t) => chip(t)).join("") + "</div>" : "") +
      '<div class="ccard__foot">' + (c.url ? linkOut(c.url) : '<span class="px faint">без посилання</span>') + "</div>" +
      "</article>";
  }).join("");

  return '<div class="view">' +
    '<div class="viewhead"><div><h1>Курси</h1>' +

      '<div class="stat"><div class="stat__k">Пройдено</div><div class="stat__v">' + (counts.done || 0) + "</div></div>" +
      '<div class="stat"><div class="stat__k">Годин</div><div class="stat__v">' + Math.round(doneH) + "<small> / " + totalH + "</small></div></div>" +

            (r.starred ? ";color:var(--clay-ink)" : "") + '">' + ico("spark") + "</button>" +

        "</div></div>" +

      (r.note ? '<div class="ccard__note">' + fmt(r.note) + "</div>" : "") +
      '<div class="ccard__foot">' + (r.url ? linkOut(r.url, "Відкрити") : '<span class="px faint">без посилання</span>') +
        '<span class="px faint">' + esc(fmtShort(r.added)) + "</span></div>" +

  return '<div class="view">' +
    '<div class="viewhead"><div><h1>Матеріали</h1>' +

}

/* ============================================================
   Lookups
   ============================================================ */
function findTask(id) {
  for (const tr of state.tracks)
    for (const s of tr.steps || [])
      for (const p of s.phases || [])
        for (const c of p.sections || []) {
          const i = (c.tasks || []).findIndex((t) => t.id === id);
          if (i > -1) return { track: tr, step: s, phase: p, section: c, task: c.tasks[i], index: i };
        }
  return null;
}
function findSection(id) {
  for (const tr of state.tracks)
    for (const s of tr.steps || [])
      for (const p of s.phases || []) {
        const i = (p.sections || []).findIndex((c) => c.id === id);
        if (i > -1) return { track: tr, step: s, phase: p, section: p.sections[i], index: i };
      }
  return null;
}
function findPhase(id) {
  for (const tr of state.tracks)
    for (const s of tr.steps || []) {
      const i = (s.phases || []).findIndex((p) => p.id === id);
      if (i > -1) return { track: tr, step: s, phase: s.phases[i], index: i };
    }
  return null;
}
function findStep(id) {
  for (const tr of state.tracks) {
    const i = (tr.steps || []).findIndex((s) => s.id === id);
    if (i > -1) return { track: tr, step: tr.steps[i], index: i };
  }
  return null;
}
function findMaterial(id) {
  for (const tr of state.tracks)
    for (const s of tr.steps || [])
      for (const p of s.phases || []) {
        const i = (p.materials || []).findIndex((m) => m.id === id);
        if (i > -1) return { phase: p, material: p.materials[i], index: i };
      }
  return null;
}

/* Any step / phase / section by id — used to refresh one counter in place. */
function findNode(id) {
  const st = findStep(id);
  if (st) return st.step;
  const ph = findPhase(id);
  if (ph) return ph.phase;
  const se = findSection(id);
  if (se) return se.section;
  return null;
}

/* Flip one task row without rebuilding the view around it. */
function updateTaskRow(el, task) {
  const row = el && el.closest(".task");
  if (!row) return;
  row.classList.toggle("is-done", task.done);
  let date = row.querySelector(".task__date");
  if (task.done) {
    if (!date) {
      date = document.createElement("span");
      date.className = "task__date";
      row.insertBefore(date, row.querySelector(".task__act"));
    }
    date.textContent = fmtShort(task.doneAt);
  } else if (date) {
    date.remove();
  }
}

/* Repoint every counter, percentage and bar the page is currently showing. */
function refreshCounters() {
  $$("[data-count]").forEach((el) => {
    const node = findNode(el.dataset.count);
    if (!node) return;
    const c = countTasks(node);
    el.textContent = c.done + "/" + c.total;
  });
  $$("[data-pct]").forEach((el) => {
    const node = findNode(el.dataset.pct);
    if (!node) return;
    const c = countTasks(node);
    el.textContent = c.pct + "%";
    el.classList.remove("chip--done", "chip--doing");
    if (c.pct === 100) el.classList.add("chip--done");
    else if (c.pct > 0) el.classList.add("chip--doing");
  });
  $$("[data-bar]").forEach((el) => {
    const node = findNode(el.dataset.bar);
    if (!node) return;
    const c = countTasks(node);
    const track = el.querySelector(".bar");
    const fill = el.querySelector(".bar__fill");
    if (fill) fill.style.width = c.pct + "%";
    if (track) track.setAttribute("aria-valuenow", c.pct);
  });
  renderRail();
}

/* ============================================================
   Modal form builder
   ============================================================ */
let modalSubmit = null;

function openForm(opts) {
  const dlg = $("#modal");
  $("#modalTitle").textContent = opts.title;
  $("#modalBody").innerHTML = '<div class="formgrid">' + opts.fields.map(fieldHtml).join("") + "</div>";
  $("#modalFoot").innerHTML =
    (opts.destructive ? '<button class="btn btn--sm btn--ghost btn--danger" type="button" data-modal="delete">' + ico("trash") + "Видалити</button>" : "") +
    '<span class="spacer"></span>' +
    '<button class="btn btn--sm btn--ghost" type="button" data-modal="cancel">Скасувати</button>' +
    '<button class="btn btn--sm btn--primary" type="button" data-modal="ok">' + esc(opts.submit || "Зберегти") + "</button>";

  modalSubmit = {
    fields: opts.fields,
    onSubmit: opts.onSubmit,
    onDelete: opts.onDelete,
    subject: opts.subject || "",
    deleteMessage: opts.deleteMessage || "",
    deleteTitle: opts.deleteTitle || ""
  };
  if (!dlg.open) dlg.showModal();
  const first = $("#modalBody").querySelector("input,textarea,select");
  if (first && window.matchMedia("(min-width: 760px)").matches) first.focus();

  function fieldHtml(f) {
    const id = "f_" + f.name;
    const common = 'class="field" id="' + id + '" name="' + esc(f.name) + '"';
    let control;
    if (f.type === "textarea") {
      control = "<textarea " + common + ' rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || "") + '">' + esc(f.value || "") + "</textarea>";
    } else if (f.type === "select") {
      control = "<select " + common + ">" + f.options.map((o) =>
        '<option value="' + esc(o[0]) + '"' + (String(f.value) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select>";
    } else {
      control = "<input " + common + ' type="' + (f.type || "text") + '"' +
        (f.type === "url" ? ' inputmode="url" spellcheck="false"' : "") +
        (f.type === "number" ? ' inputmode="numeric" min="' + (f.min != null ? f.min : 0) + '"' + (f.max != null ? ' max="' + f.max + '"' : "") : "") +
        ' autocomplete="off" placeholder="' + esc(f.placeholder || "") + '" value="' + esc(f.value == null ? "" : f.value) + '">';
    }
    const wrap = '<div><label class="lab" for="' + id + '">' + esc(f.label) + "</label>" + control +
      (f.hint ? '<div class="px faint" style="margin-top:5px;line-height:1.4">' + esc(f.hint) + "</div>" : "") + "</div>";
    return f.half ? wrap : wrap;
  }
}

function readForm() {
  const out = {};
  modalSubmit.fields.forEach((f) => {
    const el = $("#f_" + f.name);
    if (!el) return;
    out[f.name] = f.type === "number" ? Number(el.value || 0) : el.value.trim();
  });
  return out;
}

function closeModal() {
  modalSubmit = null;
  $("#modal").close();
}

/* The artifact page runs sandboxed, where window.confirm() is ignored and
   silently returns false — every destructive action would quietly do nothing.
   So confirmation is an in-page dialog, which the sandbox does allow. */
let confirmResolve = null;

function askConfirm(opts) {
  const dlg = $("#confirmDlg");
  $("#confirmTitle").textContent = (opts && opts.title) || "Підтвердь дію";
  $("#confirmMsg").textContent = (opts && opts.message) || "";
  const yes = $("#confirmYes");
  yes.textContent = (opts && opts.confirm) || "Видалити";
  return new Promise((resolve) => {
    confirmResolve = resolve;
    if (!dlg.open) dlg.showModal();
    yes.focus();
  });
}

function settleConfirm(answer) {
  const dlg = $("#confirmDlg");
  const resolve = confirmResolve;
  confirmResolve = null;
  if (dlg.open) dlg.close();
  if (resolve) resolve(answer);
}

function confirmThen(message, fn, opts) {
  askConfirm({
    message: message,
    title: opts && opts.title,
    confirm: opts && opts.confirm
  }).then((ok) => { if (ok) fn(); });
}

      submit: "Додати",
      fields: [
        { name: "title", label: "Назва", placeholder: "Напр. The Illustrated Transformer" },
        { name: "url", label: "Посилання", type: "url", placeholder: "https://…" },
        { name: "type", label: "Тип", type: "select", value: "article", options: Object.keys(RES_TYPES).map((k) => [k, RES_TYPES[k]]) },
        { name: "tags", label: "Теги", placeholder: "через кому: rag, foundations" },
        { name: "note", label: "Нотатка", type: "textarea", rows: 2, placeholder: "Чим корисне, що звідти взяти" }
      ],
      onSubmit(v) {
        if (!v.title && !v.url) return false;
        state.resources.push({
          id: uid("r"), title: v.title || hostOf(safeUrl(v.url)) || "Без назви",
          url: v.url, type: v.type, tags: splitTags(v.tags), note: v.note,
          added: todayISO(), starred: false
        });
        commit();
        toast("Матеріал додано", "good");
      }
    });
  },

  "edit-res"(id) {
    const i = state.resources.findIndex((r) => r.id === id);
    if (i < 0) return;
    const r = state.resources[i];
    openForm({
      title: "Матеріал",
      destructive: true,
      subject: r.title,
      deleteTitle: "Видалити матеріал",
      fields: [
        { name: "title", label: "Назва", value: r.title },
        { name: "url", label: "Посилання", type: "url", value: r.url || "" },
        { name: "type", label: "Тип", type: "select", value: r.type, options: Object.keys(RES_TYPES).map((k) => [k, RES_TYPES[k]]) },
        { name: "tags", label: "Теги", value: (r.tags || []).join(", ") },
        { name: "note", label: "Нотатка", type: "textarea", rows: 2, value: r.note || "" }
      ],
      onSubmit(v) {
        if (!v.title && !v.url) return false;
        Object.assign(r, { title: v.title, url: v.url, type: v.type, tags: splitTags(v.tags), note: v.note });
        commit();
      },
      onDelete() { state.resources.splice(i, 1); commit(); toast("Матеріал видалено"); }
    });
  },

  "del-res"(id) {
    const i = state.resources.findIndex((r) => r.id === id);
    if (i < 0) return;
    confirmThen(
      "Видалити «" + state.resources[i].title + "» з бібліотеки матеріалів?",
      () => { state.resources.splice(i, 1); commit(); toast("Матеріал видалено"); },
      { title: "Видалити матеріал" }
    );
  },

  "star-res"(id) {
    const r = state.resources.find((x) => x.id === id);
    if (!r) return;
    r.starred = !r.starred;
    commit();
  },

  "add-log"() {
    openForm({
      title: "Запис у журнал",
      submit: "Зберегти",
      fields: [
        { name: "date", label: "Дата", type: "date", value: todayISO() },
        { name: "text", label: "Що сьогодні", type: "textarea", rows: 6, placeholder: "Що не зрозумів, який приклад допоміг, де здивувався…" }
      ],
      onSubmit(v) {
        if (!v.text) return false;
        state.log.push({ id: uid("l"), date: v.date || todayISO(), text: v.text });
        commit();
        toast("Записано", "good");
      }
    });
  },

  "edit-log"(id) {
    const i = state.log.findIndex((l) => l.id === id);
    if (i < 0) return;
    const l = state.log[i];
    openForm({
      title: "Запис",
      destructive: true,
      deleteTitle: "Видалити запис",
      deleteMessage: "Видалити запис журналу від " + fmtLong(l.date) + "? Скасувати цю дію не вийде.",
      fields: [
        { name: "date", label: "Дата", type: "date", value: l.date },
        { name: "text", label: "Текст", type: "textarea", rows: 8, value: l.text }
      ],
      onSubmit(v) {
        if (!v.text) return false;
        l.date = v.date || l.date;
        l.text = v.text;
        commit();
      },
      onDelete() { state.log.splice(i, 1); commit(); toast("Запис видалено"); }
    });
  },

  "del-log"(id) {
    const i = state.log.findIndex((l) => l.id === id);
    if (i < 0) return;
    confirmThen(
      "Видалити запис журналу від " + fmtLong(state.log[i].date) + "?",
      () => { state.log.splice(i, 1); commit(); toast("Запис видалено"); },
      { title: "Видалити запис" }
    );
  },

  "add-track"() {
    openForm({
      title: "Новий трек",
      submit: "Створити",
      fields: [
        { name: "title", label: "Назва треку", placeholder: "Напр. System Design" },
        { name: "subtitle", label: "Опис", type: "textarea", rows: 2 },
        { name: "start", label: "Старт", type: "date", value: todayISO() },
        { name: "hours", label: "Годин загалом", type: "number", value: 0 },
        { name: "budget", label: "Бюджет часу", placeholder: "Напр. 6 год/тиждень" }
      ],
      onSubmit(v) {
        if (!v.title) return false;
        const t = blankTrack(v.title);
        t.subtitle = v.subtitle; t.start = v.start || todayISO(); t.hours = v.hours; t.budget = v.budget;
        state.tracks.push(t);
        state.activeTrack = t.id;
        ui.view = "plan";
        saveUI();
        commit();
        toast("Трек створено — додай перші фази", "good");
      }
    });
  },

  "edit-track"() {
    const t = activeTrack();
    openForm({
      title: "Трек",
      destructive: state.tracks.length > 1,
      deleteTitle: "Видалити трек",
      deleteMessage: "Видалити трек «" + t.title + "» разом із усім планом? Це " +
        nplural(countTasks(t).total, "задача", "задачі", "задач") +
        ". Курси, матеріали і журнал залишаться — вони спільні для всіх треків.",
      fields: [
        { name: "title", label: "Назва", value: t.title },
        { name: "subtitle", label: "Опис", type: "textarea", rows: 2, value: t.subtitle || "" },
        { name: "start", label: "Старт", type: "date", value: t.start || "" },
        { name: "hours", label: "Годин загалом", type: "number", value: t.hours || 0 },
        { name: "budget", label: "Бюджет часу", value: t.budget || "" }
      ],
      onSubmit(v) {
        if (!v.title) return false;
        Object.assign(t, { title: v.title, subtitle: v.subtitle, start: v.start, hours: v.hours, budget: v.budget });
        commit();
      },
      onDelete() {
        if (state.tracks.length < 2) { toast("Останній трек видалити не можна", "bad"); return; }
        state.tracks = state.tracks.filter((x) => x.id !== t.id);
        state.activeTrack = state.tracks[0].id;
        commit();
        toast("Трек видалено");
      }
    });
  },

  /* ---------- data menu ---------- */
  menu() {
    const tr = activeTrack();
    const c = countTasks(tr);
    const modeLabel = store.mode === "cloud"
      ? "Зміни зберігаються автоматично й доступні з будь-якого пристрою за цим посиланням."
      : "Зберігається лише в цьому браузері. Роби експорт час від часу, щоб не втратити прогрес.";
    $("#modalTitle").textContent = "Дані та трек";
    $("#modalBody").innerHTML =
      '<div class="col" style="gap:14px">' +
        '<div class="card card--sunk" style="padding:12px 13px">' +
          '<div class="px faint" style="margin-bottom:6px">Збереження</div>' +
          '<p class="prose" style="font-size:13px;margin:0">' + esc(modeLabel) + "</p>" +
        "</div>" +
        '<div class="statgrid">' +
          '<div class="stat"><div class="stat__k">Задач</div><div class="stat__v">' + c.done + "<small> / " + c.total + "</small></div></div>" +
          '<div class="stat"><div class="stat__k">Курсів</div><div class="stat__v">' + state.courses.length + "</div></div>" +
          '<div class="stat"><div class="stat__k">Матеріалів</div><div class="stat__v">' + state.resources.length + "</div></div>" +
          '<div class="stat"><div class="stat__k">Записів</div><div class="stat__v">' + state.log.length + "</div></div>" +
        "</div>" +
        '<div class="col" style="gap:8px">' +
          '<button class="btn" type="button" data-act="edit-track" style="justify-content:center">' + ico("pen") + "Налаштування треку</button>" +
          '<button class="btn" type="button" data-act="export" style="justify-content:center">' + ico("down") + "Експорт у JSON</button>" +
          '<button class="btn" type="button" data-act="import" style="justify-content:center">' + ico("up") + "Імпорт з JSON</button>" +
          '<button class="btn btn--danger" type="button" data-act="reset" style="justify-content:center">' + ico("warn") + "Скинути до вихідного плану</button>" +
        "</div>" +
      "</div>";
    $("#modalFoot").innerHTML = '<span class="spacer"></span><button class="btn btn--sm btn--ghost" type="button" data-modal="cancel">Закрити</button>';
    modalSubmit = null;
    if (!$("#modal").open) $("#modal").showModal();
  },

  async export() {
    const json = JSON.stringify(state, null, 2);
    const filename = "track-runner-" + todayISO() + ".json";

    /* Which download path is even possible depends on where the page runs, so
       branch on the environment — not on a thrown error. A sandboxed <a download>
       fails silently, and reporting a save that never happened is worse than
       offering the clipboard. */
    const hosted = !!(window.claude && typeof window.claude.use === "function");

    if (hosted) {
      try {
        const dl = await window.claude.use("downloads");
        if (dl) {
          await dl.save({ filename: filename, data: json });
          toast("Файл збережено", "good");
          return;
        }
      } catch (err) {
        if (err && err.code === "user_declined") return;
      }
    } else {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Файл збережено: " + filename, "good");
      return;
    }

    try {
      await navigator.clipboard.writeText(json);
      toast("Завантаження недоступне — JSON скопійовано в буфер обміну", "good");
    } catch {
      toast("Не вдалося зберегти файл. Скопіюй дані вручну через консоль браузера.", "bad");
    }
  },

  import() { $("#fileInput").click(); },

  reset() {
    confirmThen(
      "Усе повернеться до вихідного AI Engineer Track. Свої задачі, курси, матеріали і записи журналу буде втрачено — спочатку зроби експорт, якщо вони потрібні.",
      () => {
        state = freshState();
        ui.open = {};
        saveUI();
        closeModal();
        commit();
        toast("Скинуто до вихідного плану");
      },
      { title: "Скинути все", confirm: "Скинути" }
    );
  }
});

function phaseDeletePrompt(phase) {
  const c = countTasks(phase);
  return "Видалити фазу «" + phase.title + "» разом із усім вмістом? Це " +
    nplural(c.total, "задача", "задачі", "задач") + ", з них закритих — " + c.done + ".";
}

function stepDeletePrompt(step) {
  const c = countTasks(step);
  return "Видалити step «" + step.title + "» разом із усім вмістом? Це " +
    nplural((step.phases || []).length, "фаза", "фази", "фаз") + " і " +
    nplural(c.total, "задача", "задачі", "задач") + ", з них закритих — " + c.done + ".";
}

function removeStep(hit) {
  (hit.step.phases || []).forEach((p) => { delete ui.open[p.id]; });
  hit.track.steps.splice(hit.index, 1);
  saveUI();
  commit();
  toast("Step видалено");
}

function clamp(n) { return Math.max(0, Math.min(100, Number(n) || 0)); }
function splitTags(s) {
  return String(s || "").split(",").map((x) => x.trim()).filter(Boolean).slice(0, 10);
}

/* ============================================================
   Render root
   ============================================================ */
const VIEW_IDS = ["overview", "plan", "courses", "resources", "log", "ref"];

function viewFromHash() {
  const h = (location.hash || "").replace(/^#/, "");
  return VIEW_IDS.includes(h) ? h : null;
}
function syncHash(replace) {
  const target = "#" + ui.view;
  if (location.hash === target) return;
  if (replace) history.replaceState(null, "", target);
  else history.pushState(null, "", target);
}

const VIEWS = {
  overview: viewOverview,
  plan: viewPlan,
  courses: viewCourses,
  resources: viewResources,
  log: viewLog,
  ref: viewRef
};

let renderedView = null;

function render() {
  if (!state.tracks.some((t) => t.id === state.activeTrack)) state.activeTrack = state.tracks[0].id;

  const y = window.scrollY;
  const active = document.activeElement;
  const keep = active && active.dataset && active.dataset.act
    ? { act: active.dataset.act, id: active.dataset.id || "" }
    : null;
  const changedView = renderedView !== ui.view;

  renderRail();
  const fn = VIEWS[ui.view] || viewOverview;
  $("#view").innerHTML = fn();
  renderedView = ui.view;
  document.title = activeTrack().title + " · Track Runner";

  if (changedView) {
    const view = $(".view");
    if (view) view.classList.add("is-new");
  } else {
    /* same view rebuilt — hold the reader's place instead of snapping to top */
    window.scrollTo(0, y);
    if (keep) {
      const again = document.querySelector(
        '[data-act="' + keep.act + '"]' + (keep.id ? '[data-id="' + keep.id + '"]' : "")
      );
      if (again) again.focus({ preventScroll: true });
    }
  }
}

/* ============================================================
   Theme
   ============================================================ */
const THEME_KEY = "track-runner.theme";
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function initTheme() {
  let t = "system";
  try { t = localStorage.getItem(THEME_KEY) || "system"; } catch { /* blocked storage */ }
  applyTheme(t);
  $("#btnTheme").addEventListener("click", () => {
    let cur = "system";
    try { cur = localStorage.getItem(THEME_KEY) || "system"; } catch { /* ignore */ }
    const next = cur === "system" ? "light" : cur === "light" ? "dark" : "system";
    try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
    applyTheme(next);
    toast(next === "system" ? "Тема: як у системі" : next === "light" ? "Тема: світла" : "Тема: темна");
  });
}

/* ============================================================
   Events
   ============================================================ */
function wire() {
  /* delegated clicks */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    if (el.matches('input[type="checkbox"]') || el.matches('input[type="range"]')) return;
    const act = el.dataset.act;
    const fn = ACTIONS[act];
    if (!fn) return;
    e.preventDefault();
    fn(el.dataset.id, el);
  });

  /* checkboxes */
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.matches('input[type="checkbox"][data-act="toggle"]')) ACTIONS.toggle(el.dataset.id, el);
  });

  /* range sliders — live bar, debounced save */
  let rangeTimer = null;
  document.addEventListener("input", (e) => {
    const el = e.target;

    if (el.matches('input[type="range"][data-act="course-progress"]')) {
      const c = state.courses.find((x) => x.id === el.dataset.id);
      if (!c) return;
      c.progress = clamp(el.value);
      if (c.progress === 100 && c.status !== "done") c.status = "done";
      else if (c.progress > 0 && c.progress < 100 && c.status === "planned") c.status = "active";
      const card = el.closest(".ccard");
      const fill = card && card.querySelector(".bar__fill");
      if (fill) fill.style.width = c.progress + "%";
      const pctEl = card && card.querySelector('.px[style*="clay-ink"]');
      if (pctEl) pctEl.textContent = c.progress + "%";
      clearTimeout(rangeTimer);
      rangeTimer = setTimeout(() => commit(), 500);
      return;
    }

    if (el.id === "planSearch") {
      ui.q = el.value;
      saveUI();
      clearTimeout(rangeTimer);
      rangeTimer = setTimeout(() => {
        const caret = el.selectionStart;
        render();
        const next = $("#planSearch");
        if (next) { next.focus(); try { next.setSelectionRange(caret, caret); } catch { /* ignore */ } }
      }, 220);
    }
  });

  /* back / forward move between sections */
  window.addEventListener("popstate", () => {
    const v = viewFromHash();
    if (v && v !== ui.view) { ui.view = v; saveUI(); render(); }
  });

  /* keep the rail parked right under the topbar at any size */
  const bar = $(".topbar");
  const syncBarHeight = () => {
    document.documentElement.style.setProperty("--topbar-h", bar.offsetHeight + "px");
  };
  syncBarHeight();
  if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(bar);
  else window.addEventListener("resize", syncBarHeight);

  /* topbar */
  $("#btnMenu").addEventListener("click", () => ACTIONS.menu());
  $("#btnAddTrack").addEventListener("click", () => ACTIONS["add-track"]());

  /* modal buttons */
  $("#modalFoot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-modal]");
    if (!b) return;
    e.preventDefault();
    handleModal(b.dataset.modal);
  });
  $("#modalClose").addEventListener("click", () => closeModal());

  /* confirm dialog: buttons, Esc, and backdrop all resolve the promise */
  const cdlg = $("#confirmDlg");
  cdlg.addEventListener("click", (e) => {
    const b = e.target.closest("[data-confirm]");
    if (b) { e.preventDefault(); settleConfirm(b.dataset.confirm === "yes"); return; }
    if (e.target === cdlg) settleConfirm(false);
  });
  cdlg.addEventListener("cancel", (e) => { e.preventDefault(); settleConfirm(false); });
  cdlg.addEventListener("close", () => { if (confirmResolve) settleConfirm(false); });
  $("#modalForm").addEventListener("submit", (e) => { e.preventDefault(); handleModal("ok"); });
  $("#modal").addEventListener("close", () => { modalSubmit = null; });
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

  /* import */
  $("#fileInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const parsed = migrate(JSON.parse(await file.text()));
      if (!parsed) throw new Error("shape");
      state = parsed;
      ui.open = {};
      saveUI();
      closeModal();
      commit();
      toast("Дані імпортовано", "good");
    } catch {
      toast("Файл не схожий на експорт Track Runner — імпорт скасовано", "bad");
    }
  });

  /* keyboard shortcuts */
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,textarea,select")) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && $("#modal").open) { e.preventDefault(); handleModal("ok"); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($("#modal").open || $("#confirmDlg").open) return;
    const k = e.key.toLowerCase();
    const map = { "1": "overview", "2": "plan", "3": "courses", "4": "resources", "5": "log", "6": "ref" };
    if (map[k]) { ACTIONS.view(map[k]); return; }
    if (k === "/" && ui.view === "plan") { e.preventDefault(); const s = $("#planSearch"); if (s) s.focus(); }
  });

  /* last chance to flush before the tab goes away */
  window.addEventListener("beforeunload", () => { if (store.pending) store.writeLocal(state); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && store.pending) store.flush(); });
}

function handleModal(kind) {
  if (kind === "cancel") { closeModal(); return; }
  if (!modalSubmit) { closeModal(); return; }
  if (kind === "delete") {
    if (!modalSubmit.onDelete) return;
    const fn = modalSubmit.onDelete;
    const message = modalSubmit.deleteMessage ||
      (modalSubmit.subject
        ? "Видалити «" + modalSubmit.subject + "» безповоротно? Скасувати цю дію не вийде."
        : "Видалити безповоротно? Скасувати цю дію не вийде.");
    askConfirm({
      title: modalSubmit.deleteTitle || "Видалити",
      message: message
    }).then((ok) => {
      if (!ok) return;
      closeModal();
      fn();
    });
    return;
  }
  if (kind === "ok") {
    const values = readForm();
    const fn = modalSubmit.onSubmit;
    if (fn && fn(values) === false) {
      const empty = $$("#modalBody input, #modalBody textarea").find((el) => !el.value.trim());
      if (empty) empty.focus();
      toast("Заповни назву — без неї запис не збережеться", "bad");
      return;
    }
    closeModal();
  }
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot() {
  loadUI();
  initTheme();
  wire();

  await store.init();

  const local = store.readLocal();
  const remote = store.mode === "cloud" ? await store.readRemote() : null;

  if (remote && local) {
    state = (remote.updatedAt || "") >= (local.updatedAt || "") ? remote : local;
  } else if (remote) {
    state = remote;
  } else if (local) {
    state = local;
  } else {
    state = freshState();
    store.writeLocal(state);
  }

  setSaveChip(store.mode === "cloud" ? "saved" : "local",
    store.mode === "cloud" ? "Збережено" : "На цьому пристрої");

  ui.view = viewFromHash() || ui.view;
  syncHash(true);
  render();

  if (store.mode === "local") {
    setTimeout(() => toast("Прогрес зберігається в цьому браузері. Час від часу роби експорт із меню.", "good"), 900);
  }
})();
</script>
